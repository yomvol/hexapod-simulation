controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz, must match the world's 1 ms physics step

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg1_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    leg2_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    leg3_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    leg4_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    leg5_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    leg6_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# JointTrajectoryController parameters must be declared under each controller's
# own node namespace — anything placed under `controller_manager:` is ignored
# by the leg controllers.

leg1_controller:
  ros__parameters:
    joints:
      - joint_1_1
      - joint_1_2
      - joint_1_3
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false
    interpolate_from_desired_state: false # false = closed-loop start from measured state
    action_monitor_rate: 20.0

    # Effort command interface => JTC runs closed-loop PID per joint.
    # p: proportional band ~0.05 rad (2.8 N·m max effort / p); d: ~2*sqrt(p*J)
    # for the swing-leg inertia; i + i_clamp: droop rejection with anti-windup;
    # ff_velocity_scale: 1.0 feeds the trajectory's desired velocity forward.
    gains:
      joint_1_1:
        p: 50.0
        i: 50.0
        d: 0.1
        i_clamp: 1.0
        antiwindup: true
        ff_velocity_scale: 1.0
      joint_1_2:
        p: 50.0
        i: 50.0
        d: 0.1
        i_clamp: 1.0
        antiwindup: true
        ff_velocity_scale: 1.0
      joint_1_3:
        p: 50.0
        i: 50.0
        d: 0.1
        i_clamp: 1.0
        antiwindup: true
        ff_velocity_scale: 1.0

    # Tracking constraints: leave disabled until the gains are verified, then
    # enable — with them off, a goal SUCCEEDS whenever the trajectory time
    # elapses, regardless of actual tracking.
    # constraints:
    #   stopped_velocity_tolerance: 0.1
    #   goal_time: 0.0
    #   joint_1_1:
    #     trajectory: 0.15
    #     goal: 0.05
    #   joint_1_2:
    #     trajectory: 0.15
    #     goal: 0.05
    #   joint_1_3:
    #     trajectory: 0.15
    #     goal: 0.05

