controller_manager:
  ros__parameters:
    update_rate: 1000 # 50 Hz (reduced from 100 Hz for better compatibility)

    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false
    interpolate_from_desired_state: false
    action_monitor_rate : 20.0
    # hold_position: true
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg1_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    leg2_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    leg3_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    leg4_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    leg5_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    leg6_controller:
      type: joint_trajectory_controller/JointTrajectoryController

leg1_controller:
  ros__parameters:
    joints:
      - joint_1_1
      - joint_1_2
      - joint_1_3
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    gains:
      joint_1_1:
        p: 500.0
        i: 0.01
        d: 0.01
        i_clamp: 0.0
        antiwindup: true
      joint_1_2:
        p: 500.0
        i: 0.01
        d: 0.01
        i_clamp: 0.0
        antiwindup: true
      joint_1_3:
        p: 500.0
        i: 0.01
        d: 0.01
        i_clamp: 0.0
        antiwindup: true

    constraints:
      joint_1_1:
        trajectory: 0.5
        goal: 0.1
      joint_1_2:
        trajectory: 0.5
        goal: 0.1
      joint_1_3:
        trajectory: 0.5
        goal: 0.1

